name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar que las tarifas son JSON valido
        run: node -e "JSON.parse(require('fs').readFileSync('web/data/tarifas-2026.json','utf8'))"
      - name: Comprobar el manifiesto y las tarifas de la extension
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('extension/datos/amazon.json','utf8'))"
      - name: Tests del motor de calculo
        run: npm test
