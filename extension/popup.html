<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Margen real en Amazon</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <h1>Margen real</h1>
  <span id="cuota" class="cuota"></span>
</header>

<main>
  <p id="estado" class="estado">Leyendo la ficha…</p>

  <section id="producto" class="tarjeta" hidden>
    <p class="titulo" id="titulo"></p>
    <p class="precio"><span id="precio"></span> <span class="suave" id="asin"></span></p>
  </section>

  <section id="resultado" class="tarjeta resultado" hidden>
    <p class="cifra"><span id="beneficio"></span> <span class="suave">por venta</span></p>
    <p class="sub"><span id="margen"></span> de margen · equilibrio en <span id="equilibrio"></span></p>
    <table id="desglose"></table>
  </section>

  <section id="avisos" class="avisos" hidden></section>

  <details id="costes" hidden>
    <summary>Tus costes</summary>
    <div class="rejilla">
      <label>Categoria de tarifa
        <select id="c-categoria"></select>
      </label>
      <label>Plan de vendedor
        <select id="c-plan"></select>
      </label>
      <label>Te cuesta el genero (€)
        <input id="c-costeGenero" type="number" step="0.01" min="0">
      </label>
      <label>Te cuesta enviarlo (€)
        <input id="c-costeEnvio" type="number" step="0.01" min="0">
      </label>
      <label>Le cobras de envio (€)
        <input id="c-envioCobrado" type="number" step="0.01" min="0">
      </label>
      <label>Unidades por pedido
        <input id="c-unidades" type="number" step="1" min="1">
      </label>
      <label>Devoluciones (%)
        <input id="c-tasaDevolucion" type="number" step="1" min="0" max="100">
      </label>
      <label>Recuperas del genero (%)
        <input id="c-recuperacionDevolucion" type="number" step="1" min="0" max="100">
      </label>
      <label class="ancho"><input id="c-kleinunternehmer" type="checkbox"> Kleinunternehmer (no repercuto IVA)</label>
    </div>
  </details>

  <section id="muro" class="tarjeta muro" hidden>
    <h2>Se han acabado los 5 analisis gratis de este mes</h2>
    <p id="muro-texto" class="suave"></p>
    <a id="comprar" class="boton" href="#" target="_blank" rel="noopener">Comprar Pro</a>
  </section>

  <details id="activar" hidden>
    <summary>Ya tengo una clave de Pro</summary>
    <form id="form-licencia" class="licencia">
      <label for="clave">Pega aqui la clave que te llego por correo</label>
      <input id="clave" name="clave" type="text" autocomplete="off" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" required>
      <button type="submit">Activar</button>
      <p id="licencia-estado" class="suave" role="status"></p>
    </form>
  </details>

  <section id="pro" class="pro" hidden>
    <p>Pro activo. <button id="desactivar" class="enlace" type="button">Usar en otro equipo</button></p>
  </section>
</main>

<footer>
  <span id="pie" class="suave">Tus cifras no salen de este navegador.</span>
</footer>

<script type="module" src="popup.mjs"></script>
</body>
</html>
